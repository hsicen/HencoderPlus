# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Tue Nov 02 18:52:28 CST 2021
kotlin.code.style=official

# ===== 性能优化配置 =====

# JVM 配置：增加内存以支持 80+ 模块并行构建
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding\=UTF-8 -XX:+UseParallelGC

# 启用并行构建（多模块并行编译）
org.gradle.parallel=true

# 配置并行工作线程数（建议为 CPU 核心数）
# org.gradle.workers.max=8

# 启用构建缓存（跨分支复用编译结果，第二次构建提速 50%+）
org.gradle.caching=true

# 启用配置缓存（已有）
org.gradle.configuration-cache=true

# 按需配置项目（只配置需要的模块）
org.gradle.configureondemand=true

# Kotlin 编译优化
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true

# Kapt 优化（如果使用注解处理器）
kapt.incremental.apt=true
kapt.use.worker.api=true

# Android 构建优化
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# 禁用不需要的资源处理
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Java 环境
org.gradle.java.home=D\:\\DevTools\\JDK\\Jdk17
